# Control-plane settings. Env vars (from .env) override where noted.
llm:
  base_url: https://api.vultrinference.com/v1
  # Vultr's chat models reason before answering; reasoning tokens count against max_tokens, so keep it high.
  # Tested 8 Nov on the planner prompt: mimo-v2.6-pro valid first try (8.5 s); deepseek-v4.1-flash and
  # qwen3.8-27b valid at 8k tokens; glm-5.3 ran out of tokens while reasoning.
  model: mimo-v2.6-pro           # LLM_MODEL overrides this if Vultr actually serves that model
  fallback_models: [mimo-v2.6-pro, deepseek-v4.1-flash-1017, qwen3.8-27b]
  timeout_s: 120
  max_tokens: 8000

worker:
  mode: vultr                    # vultr = gVisor on Vultr VMs; local = dev subprocesses (no sandbox)
  lifecycle: shared              # shared = one VM reused by every session; per_session = boot + destroy each time
  keep_until: null               # e.g. "18:00" destroys the shared VM at that local time; off while the public demo is hosted on it
  region: lax
  plan: vhp-8c-16gb-amd          # 8 vCPU / 16 GB -> 3 sandbox slots of 2 vCPU / 3 GB
  price_per_hour: 0.132
  snapshot_prefix: autoresearch-worker
  firewall: autoresearch-workers # allows only this machine's public IP on 22/8100
  slots: 3
  sps_estimate: 950              # measured: 3 parallel PPO runs under gVisor on vhp-8c-16gb-amd (infra/bench_gvisor.sh)
  boot_timeout_s: 900
  max_lifetime_min: 60           # per_session mode only

nodes:                           # local mode only: static node agents
  - name: local
    url: http://127.0.0.1:8100   # NODE_URL overrides for the first node
    token_env: NODE_TOKEN

run:
  cpus: 2
  mem_gb: 3

rl:
  sps_estimate: 1500             # replace with scripts/bench.py; updated live from observed sps
  profile: test                  # test = N agents side by side, one short run each (fast iteration); full = screening + confirmation
  test_agents: 2
  test_steps: 300000
  video_every: 50000             # checkpoint rollout video every N steps (shown live in the UI)
  excluded_envs: [PandaReachDense-v3]   # too easy to be interesting
  max_configs: 3                 # full profile: planner may pick at most this many configs
  seeds: 3                       # predictions need >=3 seeds to be decided
  default_budget_minutes: 5
  max_budget_minutes: 10           # keep studies short
  # (wave-1 segment steps, wave-2 steps), largest that fits the budget wins
  ladder: [[50000, 100000], [25000, 50000], [10000, 20480]]   # small studies only
  verify_seconds: 15             # per verify job (10 eval episodes)

monitor:
  interval_s: 5
  llm_every_s: 120               # in wave 2, plus at rungs and on new flags
  max_forks_per_tick: 2
  fork_budget_frac: 0.15
