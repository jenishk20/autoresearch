<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Autoresearch{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=7">
{% block head %}{% endblock %}
</head>
<body>
<header class="top"><div class="top-inner">
  <a class="brand" href="/"><span class="mark"></span>Autoresearch</a>
  {% set ready = status.sandboxed and (status.worker_mode != "vultr" or (status.worker.status or "").startswith("ready")) %}
  <div class="status">
    <span title="{{ status.worker.status if status.worker_mode == 'vultr' else '' }}"><span class="dot {{ 'ok' if ready else 'warn' }}"></span>{{ "Sandboxed" if status.sandboxed else "Dev mode" }}</span>
    <span title="{{ status.llm.model }}"><span class="dot {{ 'ok' if status.llm.enabled else 'warn' }}"></span>AI</span>
  </div>
</div></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
