{% extends "base.html" %}
{% block title %}Study · Autoresearch{% endblock %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>{% endblock %}
{% block body %}
<section class="study-head">
  <h1>{{ prompt }}</h1>
  <div class="study-bar">
    <span id="live" class="dot live"></span><span id="now" class="now">Starting</span>
    <span id="elapsed" class="muted small mono"></span>
    <span class="spacer"></span>
    <button id="cancel" class="btn ghost sm hidden">Stop</button>
    <a id="report-link" class="btn sm hidden" href="/sessions/{{ sid }}/report">Results</a>
  </div>
  <div class="progress"><span id="progress" style="width:2%"></span></div>
</section>

<section id="winner" class="card winner-banner hidden"></section>
<section id="agents" class="agents"></section>

<div class="foot">
  <span id="sandbox"></span>
  <span class="spacer"></span>
  <span class="attacks" id="redteam"></span>
</div>
<ul id="contain" class="blocked"></ul>

<details><summary>Agent log</summary><ul id="feed" class="log"></ul></details>
<details><summary>Plan</summary><div id="plan" class="small muted" style="padding:8px 0"></div></details>
<details><summary>All runs (<span id="nruns">0</span>)</summary>
  <table><thead><tr><th>Agent</th><th>Robot</th><th>Seed</th><th>Status</th><th>Progress</th><th>Score</th></tr></thead><tbody id="runs"></tbody></table>
</details>
<script>window.SID = "{{ sid }}";</script>
<script src="/static/session.js?v=8"></script>
{% endblock %}
